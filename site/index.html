function calc(){if(!state.profile)return null;const d=state.profile.mode==='lmp'?daynum(state.profile.date)+280:daynum(state.profile.date);const diff=280+daynum(today())-d;return{due:isoDay(d),days:Math.max(0,d-daynum(today())),total:diff,weeks:Math.floor(Math.max(0,diff)/7),day:Math.max(0,diff)%7,week:Math.max(1,Math.min(40,Math.floor(Math.max(0,diff)/7)+1)),progress:Math.max(0,Math.min(100,Math.round(diff/280*100)))}}

><circle cx="77" cy="204" r="2.5"/></g></svg>`}
const navSvg={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',weeks:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v5M16 2v5M3 10h18"/>',journal:'<path d="M5 3h13a2 2 0 0 1 2 2v16H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3"/><path d="M9 9h7M9 13h5"/>',appts:'<path d="M3 5h18v16H3zM7 3v5M17 3v5M3 11h18"/><path d="m9 16 2 2 4-4"/>',more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>'};
function nav(){return `<nav class="bottom">${[['home','الرئيسية'],['weeks','الأسابيع'],['journal','يومياتي'],['appts','مواعيدي'],['more','المزيد']].map(([id,t])=>`<button class="navItem ${tab===id?'active':''}" onclick="go('${id}')" aria-label="${t}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${navSvg[id]}</svg><span>${t}</span></button>`).join('')}</nav>`}
function shell(content){$('#root').innerHTML=`<header class="bar"><div class="logo">الجميلة <small>♥</small> أم جميلة</div><button class="iconBtn" onclick="go('settings')" title="الإعدادات">✧</button></header>${content}${nav()}${modal?modalHTML():''}`}
function go(id){tab=id;modal=null;window.scrollTo(0,0);render()}
function toast(t){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2800)}
function onboard(){let html=`<div class="onboard"><div class="stars">✦ ✧ ✦</div>${art(220)}<span class="eyebrow">رحلة استثنائية، لكِ وحدكِ</span><h1>إلى الجميلة<br/>أم جميلة <span style="color:var(--rose)">♥</span></h1><p>رحلتكِ الأجمل، يومًا بعد يوم.<br/>رفيقة ناعمة تروي لكِ حكاية كل أسبوع.</p><div class="selectDate"><button class="toggle ${dateMode==='due'?'active':''}" onclick="dateMode='due';render()">موعد الولادة المتوقع</button><button class="toggle ${dateMode==='lmp'?'active':''}" onclick="dateMode='lmp';render()">آخر دورة شهرية</button></div><div class="field"><label>${dateMode==='due'?'موعد الولادة المتوقع وفق متابعة الطبيبة':'أول يوم في آخر دورة شهرية'}</label><input id="firstDate" type="date" required/></div><button class="action" onclick="start()">ابدئي الرحلة ♡</button><p style="font-size:12px;margin-top:15px">البيانات تُحفظ على هذا الجهاز فقط.<br/>موعد الولادة تقديري، وتعتمد المتابعة الطبية على تقييم المختص.</p></div>`;$('#root').innerHTML=html}
function start(){let dt=$('#firstDate').value;if(!dt){toast('اختاري التاريخ أولًا');return}let d=daynum(dt),due=dateMode==='lmp'?d+280:d,diff=due-daynum(today());if(diff< -30||diff>300){toast('راجعي التاريخ: يبدو بعيدًا عن فترة الحمل المعتادة');return}state.profile={mode:dateMode,date:dt,nickname:'جميلة',displayName:'',lastSeenWeek:null};state.weekCelebration=null;save();go('home')}
function home(){let p=calc(),w=p.week,quarter=w<=13?'الأول':w<=27?'الثاني':'الثالث';let upcoming=[...state.appointments].filter(a=>a.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];return `<main class="page">${milestoneBanner()}<div style="margin-top:13px"><div class="eyebrow">رِحْلَةٌ كُلُّها حُبّ ✦</div><h1 class="title">صباح الحبّ يا أم جميلة</h1><div class="textSub">كل يوم يقربكِ قليلًا من لقائكما الأول.</div></div><section class="hero"><div class="heroTop"><span>✦ في الثلث ${quarter} من الحمل</span><span>الأسبوع ${w} من 40</span></div><div class="heroMid">${art()}<div class="bigNumber">${p.weeks} <span>أسبوعًا</span> و ${p.day} <span>يوم</span></div><div class="heroDays">${p.days>0?`بقي تقريبًا ${p.days} يومًا للموعد المنتظر`:'وصلتِ إلى موعد الولادة المتوقع أو تجاوزتِه ♡'}</div></div><div class="progress"><i style="width:${p.progress}%"></i></div></section><div class="cols"><div class="stat"><em>حجم جميلة الآن</em><b>${safe(fruits[w])}</b><span class="muted" style="font-size:11px">تشبيه تقريبي</span></div><div class="stat"><em>موعد اللقاء المتوقع</em><b style="font-size:20px">${safe(fmt(p.due))}</b><span class="muted" style="font-size:11px">قد يتغير وفق الفحص الطبي</span></div></div><div class="softCard pushCard"><div class="reminderHeading"><span class="reminderBadge">♡</span><div><h3>كل أسبوع أجمل ♥</h3><p>إشعار خاص من أم جميلة عند بداية كل أسبوع جديد، حتى والجوال مقفل.</p></div></div><button class="action" onclick="window.umjEnablePush?.()">تفعيل إشعارات التطبيق ♥</button><p class="status" data-umj-push-status>اضغطي لتفعيل التنبيهات على الآيفون.</p><p class="tinyNote">تُفعّل مرة واحدة بعد إضافة التطبيق للشاشة الرئيسية. يمكنك إيقافها متى أردتِ.</p></div><div class="softCard reminderSpot"><div class="reminderHeading"><span class="reminderBadge">✦</span><div><h3>فرحة أسبوع جديد ♥</h3><p>احتفلي بدخول كل أسبوع، حتى لو كان التطبيق مغلقًا.</p></div></div><button class="action outline" onclick="downloadWeekCalendar()">أضيفي تنبيهات الأسابيع إلى تقويم الآيفون</button><p class="tinyNote">يُنشئ ملف مواعيد بتذكير الساعة ٩ صباحًا في بداية كل أسبوع قادم. يلزم استيراده إلى التقويم وتفعيل إشعارات التقويم على الجوال.</p></div><div class="sectionHead"><h2>رسالة من جميلة</h2><span style="color:var(--gold)">✧</span></div><div class="quote"><small>رسالة رمزية من القلب</small><p>يا أمي، يومًا بعد يوم تُكتب حكايتنا الجميلة. أعتني بنفسكِ، فكل لحظة هدوء تستحقينها. ♥</p></div><div class="sectionHead"><h2>كيف تشعرين اليوم؟</h2><button class="tinyLink" onclick="go('journal')">سجّلي يومكِ ←</button></div><div class="softCard"><div class="moods">${[['😍','سعيدة'],['🥰','ممتنة'],['😌','هادئة'],['🥱','متعبة'],['😟','قلقة']].map(([e,t])=>`<button class="mood" onclick="openJournal('${t}')">${e}<span>${t}</span></button>`).join('')}</div></div><div class="sectionHead"><h2>من تفاصيل هذا الأسبوع</h2><button class="tinyLink" onclick="weekSelected=${w};go('weeks')">اكتشفي أكثر ←</button></div><div class="softCard"><span class="pill">الأسبوع ${w}</span><h3 style="margin-top:12px">ماذا يحدث الآن؟</h3><p>${safe(developments[w])}</p></div><div class="softCard"><h3>موعدكِ القادم</h3>${upcoming?`<p>${safe(upcoming.title)} • ${safe(fmt(upcoming.date))} ${safe(upcoming.time||'')}</p>`:'<p>لم تُضيفي موعدًا بعد. خصصي وقتًا لمتابعتكِ الطبية المنتظمة.</p>'}<button class="tinyLink" style="margin-top:9px" onclick="go('appts')">إدارة المواعيد ←</button></div><div class="warning" style="margin-top:20px">المعلومات عامة وتقديرية، وليست تشخيصًا طبيًا. إذا شعرتِ بعلامات مقلقة، تواصلي مباشرةً مع الفريق الطبي.</div></main>`}
function weeks(){let p=calc(),w=weekSelected||p.week;weekSelected=w;let q=w<=13?'الأول':w<=27?'الثاني':'الثالث',maternal=bodyText[Math.min(bodyText.length-1,Math.floor((w-1)/2))]||bodyText[0];return `<main class="page"><div class="eyebrow" style="margin-top:12px">حكاية أربعين أسبوعًا ✦</div><h1 class="title">أسبوعًا بعد أسبوع</h1><div class="textSub">تأملي نمو جميلة وكل التغيّرات الجميلة في رحلتكِ.</div><div class="chips">${Array.from({length:40},(_,i)=>`<button class="chip ${w===i+1?'active':''}" onclick="weekSelected=${i+1};render()">${i+1}</button>`).join('')}</div><div class="softCard" style="background:linear-gradient(135deg,#fbedec,#fffaf4);padding:20px 15px"><div class="row between"><div><span class="pill">الثلث ${q}</span><h2 class="title" style="font-size:32px">الأسبوع ${w}</h2><p class="textSub">بحجم ${safe(fruits[w])} تقريبًا</p></div>${art(130,true)}</div>${w>=8?`<p class="textSub" style="margin-top:9px">${lengths[w]} سم تقريبًا ${weights[w]?`• ${weights[w]} غرام تقريبًا`:''}</p>`:''}<small class="muted">المقاييس متوسطات إرشادية، وتختلف من جنين إلى آخر، كما تختلف طرق قياس الطول بحسب المرحلة.</small></div><div class="sectionHead"><h2>داخل عالمها الصغير</h2></div><div class="softCard"><p>${safe(developments[w])}</p></div><div class="sectionHead"><h2>وماذا عن جسمكِ؟</h2></div><div class="softCard"><p>${safe(maternal)}</p><p style="margin-top:9px">قد تمرّين بأعراض مختلفة أو لا تشعرين ببعضها، وكل تجربة حمل فريدة.</p></div><div class="sectionHead"><h2>لطف هذا الأسبوع</h2></div><div class="softCard"><p>${w<=13?'امنحي نفسكِ راحة كافية، واسألي طبيبتكِ عن الفيتامينات المناسبة لكِ وحمض الفوليك.':w<=27?'حافظي على زيارات المتابعة والغذاء المتوازن والنشاط المناسب بموافقة الطبيبة.':'تحدثي مع فريق الولادة عن خطتكِ وعلامات بدء المخاض، وانتبهي لأي تغير في حركة الجنين المعتادة.'}</p></div><div class="softCard"><h3>سؤال لطبيبتكِ</h3><p>${w<=13?'هل مواعيد الفحوصات والمكملات مناسبة لحالتي؟':w<=27?'هل النمو والفحوصات يسيران كما هو متوقع؟':'ما العلامات التي تستدعي مراجعة قسم الولادة مباشرة؟'}</p></div><div class="row" style="margin-top:14px"><button class="action outline" ${w<=1?'disabled':''} onclick="weekSelected=Math.max(1,${w}-1);render()">الأسبوع السابق</button><button class="action" ${w>=40?'disabled':''} onclick="weekSelected=Math.min(40,${w}+1);render()">الأسبوع التالي</button></div><small class="textSub" style="display:block;margin-top:16px">المعلومات تثقيفية تقريبية. تُراجع المقاييس الطبية حسب الفحوصات وخطة الرعاية.</small></main>`}
function journal(){let list=[...state.entries].sort((a,b)=>b.date.localeCompare(a.date));return `<main class="page"><div class="eyebrow" style="margin-top:12px">ذكريات تنمو معكِ</div><h1 class="title">يوميات أم جميلة</h1><div class="textSub">المشاعر الصغيرة تستحق أن تُحفظ.</div><button class="action" style="margin:20px 0" onclick="openJournal()">＋ اكتبي صفحة جديدة</button><div class="field"><input id="entrySearch" placeholder="ابحثي في يومياتكِ" oninput="filterEntries(this.value)"/></div><div id="entriesList">${entriesHTML(list)}</div></main>`}
function entriesHTML(list){return list.length?list.map(e=>`<article class="entry" data-entry="${safe(e.note+' '+e.mood+' '+e.date).toLowerCase()}"><div class="row between"><h3>${safe(fmt(e.date))}</h3><span class="pill">${safe(e.mood)}</span></div><p>${safe(e.note||'ذكرى لطيفة بلا كلمات ♡')}</p><div class="buttons"><button onclick="openJournal('',${e.id})">تعديل</button><button onclick="deleteEntry(${e.id})">حذف</button></div></article>`).join(''):'<div class="empty"><div class="flower">✿</div>دفتركِ لا يزال ينتظر أول حكاية.<br/>كل يوم يحمل شيئًا يستحق الذكرى.</div>'}
function filterEntries(v){document.querySelectorAll('[data-entry]').forEach(e=>e.hidden=!e.getAttribute('data-entry').includes(v.toLowerCase()))}
function deleteEntry(id){if(!confirm('حذف هذه اليومية؟'))return;state.entries=state.entries.filter(e=>e.id!==id);save();render();toast('حُذفت اليومية')}
function appointments(){let list=[...state.appointments].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<main class="page"><div class="eyebrow" style="margin-top:12px">كل موعد خطوة للاطمئنان</div><h1 class="title">مواعيدي</h1><div class="textSub">احتفظي بمواعيد المتابعة والفحوصات في مكان واحد.</div><button class="action" style="margin:20px 0" onclick="openAppt()">＋ إضافة موعد</button>${list.length?list.map(a=>`<div class="entry"><div class="row between"><h3>${safe(a.title)}</h3><span class="pill">${safe(fmt(a.date))}</span></div><p>${safe(a.time||'')}${a.place?' • '+safe(a.place):''}${a.notes?'<br/>'+safe(a.notes):''}</p><div class="buttons"><button onclick="openAppt(${a.id})">تعديل</button><button onclick="downloadICS(${a.id})">إضافة لتقويم الجوال</button><button onclick="deleteAppt(${a.id})">حذف</button></div></div>`).join(''):'<div class="empty"><div class="flower">✿</div>لا يوجد موعد مسجّل بعد.<br/>اجعلي هذا المكان رفيق مواعيدكِ القادمة.</div>'}<div class="warning">التطبيق لا يرسل إشعارات تلقائية. يمكنكِ إضافة كل موعد إلى تقويم الجوال لتعيين تنبيه هناك.</div></main>`}
function deleteAppt(id){if(!confirm('حذف هذا الموعد؟'))return;state.appointments=state.appointments.filter(x=>x.id!==id);save();render()}
function downloadICS(id){const a=state.appointments.find(x=>x.id===id);if(!a)return;let start=(a.date+'T'+(a.time||'09:00')+':00'),dt=new Date(start),end=new Date(dt.getTime()+60*60*1000),pad=n=>String(n).padStart(2,'0'),icsDate=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;let esc=s=>String(s||'').replace(/[\\,;]/g,'\\$&').replace(/\n/g,'\\n');let content=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Um Jameela//AR\r\nBEGIN:VEVENT\r\nUID:${a.id}@um-jameela\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'')}\r\nDTSTART:${icsDate(dt)}\r\nDTEND:${icsDate(end)}\r\nSUMMARY:${esc(a.title)}\r\nLOCATION:${esc(a.place)}\r\nDESCRIPTION:${esc(a.notes)}\r\nEND:VEVENT\r\nEND:VCALENDAR`;download(new Blob([content],{type:'text/calendar;charset=utf-8'}),'mawid-jameela.ics');toast('تم تجهيز الموعد للتقويم')}
const bases=[['مراجعة متابعة الحمل','تحديد مواعيد الفحوصات','الاطلاع على المكملات مع الطبيبة','تجهيز قائمة الأسئلة للطبيبة'],['متابعة الفحوصات الدورية','تجهيز احتياجات صغيرة للمولودة','مراجعة خطة التغذية والنشاط','توثيق أجمل ذكريات الحمل'],['تحضير حقيبة المستشفى','التأكد من وسيلة الوصول للمستشفى','مناقشة خطة الولادة مع الطبيبة','تجهيز مكان نوم آمن للمولودة']];
function checks(){let w=calc().week;return `<main class="page"><div class="eyebrow" style="margin-top:12px">قليلًا قليلًا تكتمل التفاصيل</div><h1 class="title">قائمتي الجميلة</h1><div class="textSub">استعدادات صغيرة ومُطمئنة لكل مرحلة.</div>${bases.map((group,j)=>`<div class="sectionHead"><h2>الثلث ${['الأول','الثاني','الثالث'][j]}</h2><span class="pill">${j===0?'1–13':j===1?'14–27':'28–40'} أسبوعًا</span></div>${group.map((t,i)=>{let id='b-'+j+'-'+i;return `<label class="checkRow ${state.checks[id]?'done':''}"><input type="checkbox" ${state.checks[id]?'checked':''} onchange="check('${id}',this.checked)"/><span>${safe(t)}</span></label>`}).join('')}`).join('')}<div class="sectionHead"><h2>إضافاتي الخاصة</h2></div>${state.custom.map(c=>`<div class="checkRow ${state.checks['c-'+c.id]?'done':''}"><input type="checkbox" ${state.checks['c-'+c.id]?'checked':''} onchange="check('c-${c.id}',this.checked)"/><span style="flex:1">${safe(c.text)}</span><button class="tinyLink" onclick="deleteCustom(${c.id})">حذف</button></div>`).join('')}<div class="field"><input id="customTask" maxlength="140" placeholder="اكتبي مهمة خاصة بكِ"/></div><button class="action outline" onclick="addCustom()">＋ إضافة إلى القائمة</button></main>`}
function check(k,v){state.checks[k]=v;save();render()};function addCustom(){let v=$('#customTask').value.trim();if(!v)return toast('اكتبي اسم المهمة');state.custom.push({id:Date.now(),text:v});save();render()};function deleteCustom(id){state.custom=state.custom.filter(c=>c.id!==id);save();render()}
function more(){return `<main class="page"><div class="eyebrow" style="margin-top:12px">كل ما تحتاجينه في مكان واحد</div><h1 class="title">ركن أم جميلة</h1>${[['checks','✧','قائمتي الجميلة','كل استعدادات المراحل الثلاث'],['safety','♡','الاطمئنان','متى تحتاجين التواصل الطبي سريعًا؟'],['settings','⚙','الإعدادات والنسخ الاحتياطي','تواريخ الحمل وحفظ البيانات'],['about','✦','عن هذا التطبيق','هدية صُنعت بحبّ لكِ'],['sources','☷','المصادر الطبية','مراجع المعلومات العامة']].map(([id,ic,t,sub])=>`<button class="softCard row between" style="display:flex;width:100%;text-align:right;align-items:center;cursor:pointer" onclick="go('${id}')"><div class="row"><span style="font-size:23px;color:var(--rose);width:32px">${ic}</span><div><h3 style="margin:0">${t}</h3><p>${sub}</p></div></div><span style="color:var(--rose)">‹</span></button>`).join('')}</main>`}
function safety(){return `<main class="page"><div class="eyebrow" style="margin-top:12px">سلامتكِ أولًا</div><h1 class="title">الاطمئنان</h1><div class="warning">هذه معلومات عامة لا تُشخّص الحالة ولا تُغني عن الطبيب. عند أي علامة طارئة توجّهي للرعاية الطبية فورًا.</div><div class="sectionHead"><h2>متى تطلبين مساعدة عاجلة؟</h2></div>${['نزيف مهبلي أو تسرّب سوائل أثناء الحمل.','ألم شديد أو مستمر في البطن.','صداع شديد لا يزول، أو تشوّش في الرؤية.','صعوبة التنفس، أو ألم في الصدر، أو إغماء.','توقف أو انخفاض حركة الجنين مقارنة بحركته المعتادة بعد أن تصبح محسوسة.','تورم شديد مفاجئ في الوجه أو اليدين، أو حمى شديدة.'].map(x=>`<div class="softCard"><p>• ${x}</p></div>`).join('')}<div class="softCard"><h3>لا تنتظري عدّ الحركات</h3><p>إذا شعرتِ بتغيّر في نمط حركة الجنين المعتاد، تواصلي مع قسم الولادة أو الفريق المعالج فورًا، ولا تنتظري موعدًا لاحقًا أو رقمًا محددًا.</p></div><a class="action" style="display:block;text-decoration:none;text-align:center;margin-top:15px" href="tel:997">الاتصال بالإسعاف 997</a><a class="action outline" style="display:block;text-decoration:none;text-align:center;margin-top:9px" href="tel:937">الاستشارات الصحية 937</a><p class="textSub" style="font-size:12px;margin-top:15px">تُستمد علامات التحذير من إرشادات CDC وACOG مع مراعاة أن حالتكِ الشخصية يقيّمها المختص.</p></main>`}
function settings(){let p=state.profile;return `<main class="page"><div class="eyebrow" style="margin-top:12px">مثلما تحبين</div><h1 class="title">الإعدادات</h1><div class="formBox"><h3>بيانات رحلة الحمل</h3><div class="field"><label>اسم الأم (اختياري)</label><input id="editName" value="${safe(p.displayName||'')}" maxlength="30" placeholder="اسمكِ الجميل"/></div><div class="field"><label>نوع التاريخ</label><select id="editMode"><option value="due" ${p.mode==='due'?'selected':''}>موعد الولادة المتوقع</option><option value="lmp" ${p.mode==='lmp'?'selected':''}>أول يوم لآخر دورة</option></select></div><div class="field"><label>التاريخ المعتمد</label><input type="date" id="editDate" value="${safe(p.date)}"/></div><button class="action" onclick="saveSettings()">حفظ التعديلات</button><p class="calendarNote">يمكن تعديل الموعد وفق التاريخ الذي أكدته الطبيبة أو التصوير بالموجات فوق الصوتية.</p></div><div class="formBox pushCard"><h3>إشعارات التطبيق الحقيقية ♥</h3><p class="textSub">إشعار جديد عند بداية كل أسبوع حمل، يصل إلى شاشة القفل حتى لو كان التطبيق مغلقًا، بعد تفعيله على جهازكِ.</p><p class="status" data-umj-push-status>التحقق من حالة الإشعارات…</p><div class="row" style="margin-top:13px"><button class="action" onclick="window.umjEnablePush?.()">تفعيل الإشعارات</button><button class="action outline" style="background:transparent" onclick="window.umjDisablePush?.()">إيقاف</button></div><p class="calendarNote">تحتاج الميزة تشغيل خدمة الإرسال في مشروع Supabase خاص. لن يطلب التطبيق الإذن قبل ضغط زر التفعيل.</p></div><div class="formBox"><h3>تنبيه أسبوع جديد ♥</h3><p class="textSub">يمكنكِ الحصول على تنبيه في تقويم الآيفون عند بدء كل أسبوع جديد من الحمل، حتى إن لم تفتحي التطبيق. يبدأ الساعة التاسعة صباحًا وفق توقيت السعودية.</p><button class="action" onclick="downloadWeekCalendar()">تجهيز تنبيهات الأسابيع القادمة</button><p class="calendarNote">بعد تنزيل الملف، افتحيه واختاري إضافة المواعيد إلى تقويم الآيفون. إذا لم يظهر خيار الاستيراد، أرسلي الملف إلى بريدكِ وافتحيه من تطبيق البريد. تأكدي من تفعيل إشعارات التقويم في إعدادات الآيفون. إذا عدّلتِ موعد الولادة، احذفي المواعيد القديمة وأضيفي الملف الجديد. لا يُرسل التطبيق إشعارات دفع مباشرة.</p></div><div class="formBox"><h3>خصوصيتكِ وبياناتكِ</h3><p class="textSub">هذه النسخة تحفظ كل المعلومات داخل متصفح هذا الجهاز فقط، لا في خادم خارجي. قد تضيع البيانات عند مسح بيانات المتصفح أو تغيير الجهاز.</p><div class="row" style="margin-top:13px"><button class="action outline" onclick="exportData()">تصدير نسخة</button><button class="action outline" onclick="$('#importFile').click()">استيراد نسخة</button></div><input type="file" id="importFile" style="display:none" accept="application/json,.json" onchange="importData(this.files[0])"/></div><div class="formBox"><h3 style="color:#b45062">مسح كل البيانات</h3><p class="textSub">لا يمكن التراجع عن مسح البيانات إذا لم تُحفظ نسخة خارجية.</p><button class="action outline danger" onclick="resetData()">مسح جميع بياناتي</button></div></main>`}
function saveSettings(){let mode=$('#editMode').value,dt=$('#editDate').value,due=mode==='lmp'?daynum(dt)+280:daynum(dt),diff=due-daynum(today());if(!dt||diff< -30||diff>300)return toast('يرجى التحقق من التاريخ');state.profile={...state.profile,mode,date:dt,displayName:$('#editName').value.trim(),lastSeenWeek:null};state.weekCelebration=null;save();window.umjSyncPush?.();toast('حُفظ التاريخ، وسيُحدَّث حساب الأسابيع تلقائيًا.');go('home')}
function exportData(){download(new Blob([JSON.stringify({app:'um-jameela',version:1,data:state},null,2)],{type:'application/json'}),'um-jameela-backup-'+today()+'.json');toast('تم تجهيز النسخة الاحتياطية')}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importData(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='um-jameela'||!obj.data||!Array.isArray(obj.data.entries)||!Array.isArray(obj.data.appointments))throw new Error();if(!confirm('هل تريدين استبدال بيانات الجهاز الحالية بالنسخة المستوردة؟'))return;state=obj.data;save();toast('استُعيدت البيانات بنجاح');go('home')}catch{toast('الملف غير صالح للاستيراد')}}
function resetData(){if(!confirm('هل أنتِ متأكدة من مسح بيانات التطبيق كلها؟'))return;if(!confirm('تأكيد أخير: لا يمكن التراجع بعد الحذف. هل حفظتِ نسخة؟'))return;window.umjDisablePush?.();localStorage.removeItem(key);state={profile:null,entries:[],appointments:[],checks:{},custom:[]};go('home')}
function about(){return `<main class="page" style="text-align:center;padding-top:45px"><div class="stars">✧ ✦ ✧</div>${art(220)}<div class="eyebrow">هدية صغيرة بحب كبير</div><h1 class="title" style="font-size:39px">الجميلة أم جميلة ♥</h1><p class="textSub" style="font-size:16px;line-height:2.1;margin-top:20px">كل يوم من رحلتكِ حكاية تستحق أن تُروى،<br/>وكل لحظة منكِ تستحق الحبّ والطمأنينة.</p><div class="quote" style="margin-top:24px"><p>صُنِع بحبّ لأم جميلة ♥️</p><small>هدية من شخص يحبكِ</small></div><p class="textSub" style="margin-top:23px">مجاني تمامًا، دون إعلانات أو اشتراكات.</p></main>`}
function sources(){return `<main class="page"><div class="eyebrow" style="margin-top:12px">معلومة موثوقة، بلغة مطمئنة</div><h1 class="title">مصادر المعلومات</h1><div class="softCard sourceLinks"><p>المحتوى إرشادي عام ولا يحل محل التقييم الطبي. الأطوال والأوزان والتشبيهات تقديرية لا تعكس قياسات جنينكِ الفعلية.</p><a target="_blank" rel="noopener noreferrer" href="https://www.nhs.uk/best-start-in-life/pregnancy/week-by-week-guide-to-pregnancy/">NHS — تطور الحمل أسبوعًا بأسبوع</a><a target="_blank" rel="noopener noreferrer" href="https://www.cdc.gov/hearher/maternal-warning-signs/">CDC — علامات التحذير العاجلة للأم</a><a target="_blank" rel="noopener noreferrer" href="https://www.acog.org/giving/programs/quality-and-safety/resources">ACOG — موارد سلامة الأم</a></div></main>`}
function openJournal(mood='',id=null){editingJournal=id;let e=id?state.entries.find(e=>e.id===id):null;moodSelected=e?.mood||mood||'هادئة';modal='journal';render()};function openAppt(id=null){editingAppt=id;modal='appt';render()};function closeModal(){modal=null;render()}
function modalHTML(){let e=modal==='journal'&&editingJournal?state.entries.find(x=>x.id===editingJournal):null;let a=modal==='appt'&&editingAppt?state.appointments.find(x=>x.id===editingAppt):null;return `<div class="modalMask" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2 class="title" style="font-size:27px">${modal==='journal'?'صفحة من يومياتكِ':'موعد جديد'}</h2><button class="iconBtn" onclick="closeModal()">✕</button></div>${modal==='journal'?`<div class="field"><label>تاريخ اليومية</label><input type="date" id="jDate" value="${safe(e?.date||today())}"/></div><label class="eyebrow">كيف تشعرين؟</label><div class="moods" style="margin-top:13px">${[['😍','سعيدة'],['🥰','ممتنة'],['😌','هادئة'],['🥱','متعبة'],['😟','قلقة']].map(([em,t])=>`<button class="mood ${moodSelected===t?'active':''}" onclick="selectMood('${t}',this)">${em}<span>${t}</span></button>`).join('')}</div><div class="field"><label>ما الذي تودّين حفظه من اليوم؟</label><textarea id="jNote" placeholder="حدث صغير، شعور، كلمة من القلب...">${safe(e?.note||'')}</textarea></div><button class="action" onclick="saveJournal()">حفظ الصفحة ♥</button>`:`<div class="field"><label>اسم الموعد</label><input id="aTitle" value="${safe(a?.title||'')}" placeholder="زيارة الطبيبة أو الفحص"/></div><div class="field"><label>التاريخ</label><input type="date" id="aDate" value="${safe(a?.date||today())}"/></div><div class="field"><label>الوقت</label><input type="time" id="aTime" value="${safe(a?.time||'09:00')}"/></div><div class="field"><label>مكان الموعد</label><input id="aPlace" value="${safe(a?.place||'')}" placeholder="المستشفى / العيادة"/></div><div class="field"><label>ملاحظات</label><textarea id="aNotes" placeholder="أسئلة للطبيبة أو تفاصيل الموعد">${safe(a?.notes||'')}</textarea></div><button class="action" onclick="saveAppt()">حفظ الموعد</button>`}</div></div>`}
function selectMood(t,button){moodSelected=t;button.parentElement.querySelectorAll('.mood').forEach(b=>b.classList.remove('active'));button.classList.add('active')}
function saveJournal(){const date=$('#jDate').value,note=$('#jNote').value.trim();if(!date)return toast('اختاري التاريخ');let e={id:editingJournal||Date.now(),date,note,mood:moodSelected};state.entries=editingJournal?state.entries.map(x=>x.id===editingJournal?e:x):[...state.entries,e];save();modal=null;tab='journal';render();toast('حُفظت ذكراكِ الجميلة ♡')}
function saveAppt(){const title=$('#aTitle').value.trim(),date=$('#aDate').value;if(!title||!date)return toast('أدخلي اسم الموعد وتاريخه');let a={id:editingAppt||Date.now(),title,date,time:$('#aTime').value,place:$('#aPlace').value.trim(),notes:$('#aNotes').value.trim()};state.appointments=editingAppt?state.appointments.map(x=>x.id===editingAppt?a:x):[...state.appointments,a];save();modal=null;tab='appts';render();toast('حُفظ الموعد')}

function checkWeekMilestone(){
 if(!state.profile)return;
 const current=calc()?.week;
 if(!current)return;
 const prev=state.profile.lastSeenWeek;
 if(typeof prev!=="number"||!Number.isFinite(prev)){
  state.profile.lastSeenWeek=current;save();return;
 }
 if(current>prev){
  state.profile.lastSeenWeek=current;
  state.weekCelebration=current;
  save();
 }
}
function milestoneBanner(){
 const w=Number(state.weekCelebration);
 if(!Number.isInteger(w)||w<1||w>40)return '';
 return `<section class="weekCelebration" role="status"><span class="celebrationSymbol">✧</span><div><p class="miniHeader">فصل جديد من الحكاية</p><h2>أهلًا بالأسبوع ${w}، يا أم جميلة ♥</h2><p>كل أسبوع خطوة جميلة في رحلتكِ. استكشفي ما قد يتغير هذا الأسبوع.</p><div class="row"><button class="tinyPill" onclick="dismissWeekMilestone();weekSelected=${w};go('weeks')">استكشفي الأسبوع</button><button class="tinyPill secondaryPill" onclick="dismissWeekMilestone()">شكرًا ♥</button></div></div></section>`;
}
function dismissWeekMilestone(){state.weekCelebration=null;save();render()}
function calendarEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function downloadWeekCalendar(){
 const p=calc();if(!p)return toast('سجّلي تاريخ الحمل أولًا.');
 const start=Math.max(2,p.week+1);
 if(start>40)return toast('وصلتِ إلى الأسبوع الأخير؛ لا توجد تنبيهات جديدة قبل الموعد المتوقع.');
 const gestationStart=daynum(p.due)-280;
 const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const lines=[
  'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Um Jameela//Pregnancy Weekly Reminders//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH',
  'X-WR-CALNAME:'+calendarEscape('الجميلة أم جميلة ♥️'),
  'BEGIN:VTIMEZONE','TZID:Asia/Riyadh','X-LIC-LOCATION:Asia/Riyadh','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0300','TZOFFSETTO:+0300','TZNAME:AST','END:STANDARD','END:VTIMEZONE'
 ];
 let count=0;
 for(let w=start;w<=40;w++){
  const scheduled=isoDay(gestationStart+(w-1)*7);
  if(scheduled<today())continue;
  const date=scheduled.replace(/-/g,'');
  const title=`🌷 أسبوع جديد من الحمل — الأسبوع ${w} ♥️`;
  lines.push('BEGIN:VEVENT',`UID:um-jameela-week-${w}-${p.due.replace(/-/g,'')}@weekly.um-jameela`,
   `DTSTAMP:${now}`,`DTSTART;TZID=Asia/Riyadh:${date}T090000`,'DURATION:PT15M',
   `SUMMARY:${calendarEscape(title)}`,
   `DESCRIPTION:${calendarEscape('بدأ الأسبوع '+w+' من رحلة الجميلة أم جميلة ♥️. افتحي التطبيق لمشاهدة نمو الجنين والمعلومات العامة لهذا الأسبوع. موعد الولادة تقريبي.')}`,
   'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT0M',`DESCRIPTION:${calendarEscape(title)}`,'END:VALARM','END:VEVENT');
  count++;
 }
 if(!count)return toast('لا توجد أسابيع قادمة للتنبيه بناءً على التاريخ الحالي.');
 lines.push('END:VCALENDAR');
 const fold=(line)=>{let out='',n=0;for(const ch of line){const b=new TextEncoder().encode(ch).length;if(n+b>72){out+='\r\n ';n=1;}out+=ch;n+=b;}return out;};
 download(new Blob([lines.map(fold).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}),'تنبيهات-اسابيع-الجميلة-ام-جميلة.ics');
 toast(`جهزنا ${count} تذكيرًا أسبوعيًا — أضيفي الملف إلى تقويم الآيفون.`);
}
